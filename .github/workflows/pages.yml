name: Publish website
on:
  push:
    branches: [main]
    paths: ['web/**', 'scripts/build_site.py', 'scripts/prepare_record_preview.py', 'scripts/build_record_preview.mjs', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Daily CROSS']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the current public artwork
        id: artwork
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          BUILD_CAUSE: ${{ github.event_name }}
        run: |
          if [ "$BUILD_CAUSE" = "workflow_run" ]; then
            python scripts/prepare_record_preview.py --out .state/record-preview --if-changed
          else
            python scripts/prepare_record_preview.py --out .state/record-preview
          fi
      - uses: actions/setup-node@v4
        if: steps.artwork.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Prepare the record before visitors arrive
        if: steps.artwork.outputs.changed == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/build_record_preview.mjs .state/record-preview
      - run: python scripts/build_site.py --out .state/pages --record-preview .state/record-preview
        if: steps.artwork.outputs.changed == 'true'
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
      - uses: actions/configure-pages@v5
        if: steps.artwork.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.artwork.outputs.changed == 'true'
        with:
          path: .state/pages
      - uses: actions/deploy-pages@v4
        if: steps.artwork.outputs.changed == 'true'
        id: deploy
